# ── Gradle daemon JVM (build tooling) ────────────────────────────────────────
# Sized for a multi-module KMP + Compose + R8 build.
org.gradle.jvmargs=-Xmx6g -Xms2g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g

# ── Build parallelism and caching ────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
# configureondemand deliberately NOT enabled: the Kotlin Multiplatform plugin does not
# support it (KT-52074), Isolated Projects ignores it outright, and the configuration cache
# below already delivers the speedup it existed for. It is also still flagged incubating
# by Gradle 9.8 on every invocation.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Bleeding-edge: parallelize configuration-cache store/load across projects.
org.gradle.configuration-cache.parallel=true

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# ── Kotlin compiler ───────────────────────────────────────────────────────────
kotlin.incremental=true
kotlin.incremental.native=true
kotlin.mpp.stability.nowarn=true
kotlin.build.report.output=file
