name: Deploy to Amazon Appstore

# Uploads the release APK via the App Submission API (community action). Gated on
# AMAZON_APPSTORE_CLIENT_ID: no security profile exists yet, so this job no-ops until one is
# created in Amazon's Developer Console (Apps & Services → API Access) and the app is already live
# on Amazon Appstore at least once (the API can only edit an existing listing, not create one).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # A skipped run still exits zero and shows green, so it must announce the skip itself
      # in the step summary — otherwise a green check silently means "never uploaded".
      HAS_SECRET: ${{ secrets.AMAZON_APPSTORE_CLIENT_ID != '' }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Report deploy status
        run: |
          if [ "${{ env.HAS_SECRET }}" = "true" ]; then
            echo "Deploying to Amazon Appstore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Not deployed to Amazon Appstore" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No store credentials are configured, so every build and upload step was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "This run is green because nothing failed, NOT because the app was published." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the required secrets to enable it: AMAZON_APPSTORE_CLIENT_ID, AMAZON_APPSTORE_CLIENT_SECRET, AMAZON_APPSTORE_APP_ID." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive
        if: env.HAS_SECRET == 'true'

      - name: Set up JDK 21
        if: env.HAS_SECRET == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI JDK 21 (strip machine-specific java.home)
        if: env.HAS_SECRET == 'true'
        run: sed -i '/^org\.gradle\.java\.home/d; /^org\.gradle\.java\.installations\.paths/d' gradle.properties

      - name: Setup Gradle
        if: env.HAS_SECRET == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        if: env.HAS_SECRET == 'true'
        uses: android-actions/setup-android@v3

      - run: chmod +x ./gradlew
        if: env.HAS_SECRET == 'true'

      - name: Materialize signing secrets
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          mkdir -p secrets
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > secrets/release.keystore
            {
              echo "RELEASE_STORE_FILE=$PWD/secrets/release.keystore"
              echo "RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD:-}"
              echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS:-paymentslab}"
              echo "RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-}"
            } >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        if: env.HAS_SECRET == 'true'
        run: ./gradlew :app:assembleRelease

      - name: Upload to Amazon Appstore
        if: env.HAS_SECRET == 'true'
        uses: galonga/upload-amazon-appstore@v1.0.2
        with:
          clientId: ${{ secrets.AMAZON_APPSTORE_CLIENT_ID }}
          clientSecret: ${{ secrets.AMAZON_APPSTORE_CLIENT_SECRET }}
          appId: ${{ secrets.AMAZON_APPSTORE_APP_ID }}
          apkFile: app/build/outputs/apk/release/app-release.apk
