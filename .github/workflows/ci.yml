name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest

    env:
      # No daemon in CI — each run is a fresh environment, so daemon lifecycle savings don't apply
      # and orphaned daemons just add overhead.
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # Obj-C category / CEnum import guard. Pure text analysis over iosMain sources, so it runs
      # here on Linux in under a second instead of surfacing minutes into a Mac Kotlin/Native link.
      # The defect it catches hit nine times across four repos between 2026-07 and 2026-09; the
      # ninth was found in Gaddi on 2026-09-22 by running this exact script, which already existed
      # in kmp-toolkit and had simply never been pointed at the consumers.
      #
      # Skips loudly, never silently: the script arrived in kmp-toolkit after some consumers pinned
      # their submodule, so a repo on an older pin has no script to run. A silent skip would read as
      # a pass, which is the failure mode this repo's own doctrine calls "green because it read
      # nothing". The warning disappears by itself on the next toolkit bump.
      - name: Obj-C category import guard
        run: |
          guard=external/kmp-toolkit/scripts/objc-category-guard.py
          if [ -f "$guard" ]; then
            python3 "$guard" --self-test
            python3 "$guard" --root .
          else
            echo "::warning::$guard is absent at the pinned kmp-toolkit commit — the Obj-C category guard did NOT run. Bump the toolkit to enable it."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Kotlin/Native toolchain (~1 GB) lives outside ~/.gradle; cache it separately, keyed on the
      # version catalog so it invalidates when the Kotlin/KMP version changes.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v1-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # fastGate = ktlint + detekt (all modules, incl. KMP commonMain) + backend + core/feature/
      # provider unit tests. No emulator required.
      - name: Verification gate (lint + tests)
        run: ./gradlew fastGate
      # The artifact quota can block the Roborazzi report upload, so on failure print the
      # comparison summary into the log where it cannot be lost.
      - name: Roborazzi comparison summary (on failure)
        if: failure()
        run: |
          for f in app/build/test-results/roborazzi/results-summary.json app/build/outputs/roborazzi/*.json; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; echo; }
          done
          ls -la app/build/outputs/roborazzi 2>/dev/null | head -60

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        # An artifact is a convenience; the account's 500 MB artifact quota must not fail the gate.
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 2
