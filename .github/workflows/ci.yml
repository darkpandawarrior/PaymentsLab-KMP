name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest

    env:
      # No daemon in CI — each run is a fresh environment, so daemon lifecycle savings don't apply
      # and orphaned daemons just add overhead.
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Kotlin/Native toolchain (~1 GB) lives outside ~/.gradle; cache it separately, keyed on the
      # version catalog so it invalidates when the Kotlin/KMP version changes.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v1-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # fastGate = ktlint + detekt (all modules, incl. KMP commonMain) + backend + core/feature/
      # provider unit tests. No emulator required.
      - name: Verification gate (lint + tests)
        run: ./gradlew fastGate
      # The artifact quota can block the Roborazzi report upload, so on failure print the
      # comparison summary into the log where it cannot be lost.
      - name: Roborazzi comparison summary (on failure)
        if: failure()
        run: |
          for f in app/build/test-results/roborazzi/results-summary.json app/build/outputs/roborazzi/*.json; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; echo; }
          done
          ls -la app/build/outputs/roborazzi 2>/dev/null | head -60

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
