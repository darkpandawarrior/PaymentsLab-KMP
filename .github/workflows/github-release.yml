# github-release.yml — tag-triggered GitHub Release (changelog + debug/release artifacts + iOS IPA).
# Adapted from Doori's (formerly Mileway) proven template (post PR #42; see docs/RELEASE.md). Distinct from
# release.yml (that one runs the verification gate + publishes an unsigned APK on the same tag
# push, softprops/action-gh-release). This one is the three-tier-versioning-aware release: it
# creates/updates the SAME GitHub Release object (idempotent gh release create/edit), attaches every
# built variant under meaningful names, and adds the iOS artifact release.yml doesn't produce.
#
# Changelog source = commit messages between the previous tag and this one. This repo is public, so
# a RELEASE_SCRUBLIST_B64 secret is required and applied as a leak gate before publishing — a missing
# secret fails the run rather than silently publishing unscrubbed notes.
name: GitHub Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for the changelog range
          submodules: recursive   # convention plugins live in the external/kmp-build-logic submodule
      # Repo-generic: the tag must already say what scripts/version.sh computes for this exact commit
      # (FINGERPRINT = YYYY.0M.0W.MILESTONE.commitCount) before a single line gets built. Prevents
      # "tagged v2026.07.29.1.145, published a build stamped for a different commit/day" silent drift.
      - name: Verify tag matches computed FINGERPRINT
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          expected="v$(./scripts/version.sh | sed -n 's/^FINGERPRINT=//p')"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Release tag $tag does not match the FINGERPRINT computed for this commit ($expected). Re-tag with scripts/version.sh's current output, or bump MILESTONE via scripts/bump_version.sh --milestone and re-tag, so the built artifacts are stamped correctly."
            exit 1
          fi
      - name: Assemble release notes
        id: cl
        run: |
          set -uo pipefail
          cur="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${cur}^" 2>/dev/null || echo "")"
          # Prefer the curated CHANGELOG.md "## [<tag>]" section (rich, styled); fall back to commit log.
          if [ -f CHANGELOG.md ] && grep -q "^## \[${cur}\]" CHANGELOG.md; then
            awk -v tag="## [${cur}]" '$0 ~ /^## \[/ { if (started) exit; if (index($0,tag)) started=1 } started { print }' CHANGELOG.md > CHANGELOG_BODY.md
          else
            range="${prev:+$prev..}$cur"
            git log --no-merges --pretty='- %s' "$range" > CHANGELOG_BODY.md
          fi
          # Leak gate. These notes go to a PUBLIC release, so refuse to publish rather than
          # silently skip the check when the scrublist secret isn't configured.
          if [ -n "${RELEASE_SCRUBLIST_B64:-}" ]; then
            echo "$RELEASE_SCRUBLIST_B64" | base64 -d > /tmp/scrublist.txt
            pat="$(grep -vE '^\s*#|^\s*$' /tmp/scrublist.txt | paste -sd'|' -)"
            if [ -n "$pat" ] && grep -Eiq "$pat" CHANGELOG_BODY.md; then
              echo "::error::release notes match a scrublist term — refusing to publish"; exit 1
            fi
          else
            echo "::error::RELEASE_SCRUBLIST_B64 is not set; this repo is public and must not publish unscrubbed notes"
            exit 1
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_SCRUBLIST_B64: ${{ secrets.RELEASE_SCRUBLIST_B64 }}
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      # Builds every task the repo variable RELEASE_BUILD_CMD lists (PaymentsLab-KMP has no flavors, so
      # the default "assembleDebug assembleRelease" covers it). Release is signed with the real
      # keystore when a secret is materialized (see docs/RELEASE.md), else falls back to the debug
      # key (still an installable APK, not a raw unsigned blob — see app/build.gradle.kts
      # hasReleaseSigning). Some projects' release build genuinely emits `-unsigned` in the output
      # filename; the find/copy below matches that too.
      - name: Build artifacts
        run: |
          set -uo pipefail
          cmd="${RELEASE_BUILD_CMD:-assembleRelease}"
          # --continue: one variant failing (e.g. a lint/dependency-guard gate that only applies to one
          # flavor) must not discard artifacts the other requested tasks already produced. There is no
          # fallback to a single debug-only task on failure anymore — that used to silently mask every
          # release task failing and ship debug APKs under a release tag while reporting success.
          build_rc=0
          ./gradlew $cmd --continue || build_rc=$?

          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          # Attach APKs under meaningful names: PaymentsLab-KMP-<tag>-<flavor>-<buildType>.apk
          # (source name is app-<buildType>[-unsigned].apk; strip the "app-" prefix). Skip test APKs.
          # The `app-*.apk` wildcard already matches the `-unsigned` suffix an unsigned release
          # build emits, so no separate pattern is needed.
          while IFS= read -r apk; do
            variant="$(basename "$apk" .apk)"; variant="${variant#app-}"
            cp "$apk" "dist/PaymentsLab-KMP-${tag}-${variant}.apk"
          done < <(find . -path '*/outputs/apk/*' -name 'app-*.apk' -not -name '*androidTest*')

          echo "::group::Artifacts collected"; ls -la dist/ 2>/dev/null || true; echo "::endgroup::"

          # A release was requested (a version tag was pushed) — never let this job end with only debug
          # APKs, or nothing at all, while still reporting green. Fail loudly instead.
          release_count="$(find dist -maxdepth 1 -name '*-release*.apk' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$release_count" -eq 0 ]; then
            echo "::error::No release APK was produced (gradle exit $build_rc for '$cmd'). Refusing to publish a debug-only release — check the Gradle log above for the release-variant failure (signing/minify/lint/dependency-guard)."
            exit 1
          fi
          if [ "$build_rc" -ne 0 ]; then
            echo "::warning::Gradle build for '$cmd' exited $build_rc — at least one requested variant failed to build. Attaching the $release_count release APK(s) and any debug APK(s) that DID build; check the log above for which task(s) failed."
          fi
        env:
          RELEASE_BUILD_CMD: ${{ vars.RELEASE_BUILD_CMD }}
      # Visual artifacts + golden diff vs previous release (screenshots/GIFs "tagged against release").
      - name: Visual artifacts + golden diff
        run: |
          set -uo pipefail
          prev="${{ steps.cl.outputs.prev }}"; cur="${GITHUB_REF_NAME}"
          shots="docs/screenshots"
          if [ -d "$shots" ]; then
            ( cd "$shots" && zip -q -r "$GITHUB_WORKSPACE/dist/screenshots.zip" . ) || true
            [ -d docs/gifs ] && find docs/gifs -name '*.gif' -exec cp {} dist/ \; || true
            { echo; echo "## Visual changes"; echo; } >> CHANGELOG_BODY.md
            if [ -n "$prev" ] && git rev-parse "$prev" >/dev/null 2>&1; then
              diff=$(git diff --name-status "$prev".."$cur" -- "$shots" || true)
              a=$(echo "$diff" | grep -c '^A' || true); m=$(echo "$diff" | grep -c '^M' || true); d=$(echo "$diff" | grep -c '^D' || true)
              echo "Since \`$prev\`: **$a new**, **$m changed**, **$d removed** screens." >> CHANGELOG_BODY.md
            else
              echo "First tracked visual baseline ($(find "$shots" -name '*.png' | wc -l | tr -d ' ') screens)." >> CHANGELOG_BODY.md
            fi
          fi
      - name: Create or update release
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          # nice title from the CHANGELOG header if present, else the tag
          # `|| true` so a missing CHANGELOG header never aborts the step under `bash -e` (falls back to the tag)
          title="$(grep -m1 "^## \[${tag}\]" CHANGELOG.md 2>/dev/null | sed -E 's/^## \[[^]]*\][[:space:]]*(—[[:space:]]*)?//' || true)"
          [ -n "$title" ] && title="${tag} — ${title}" || title="$tag"
          # idempotent: create if absent, else update notes (so a manual pre-create or a re-run never fails)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file CHANGELOG_BODY.md || true
          else
            gh release create "$tag" --title "$title" --notes-file CHANGELOG_BODY.md || true
          fi
          # attach artifacts best-effort — a missing/failed build never fails the release
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -gt 0 ]; then gh release upload "$tag" "${files[@]}" --clobber || true; else echo "no artifacts to attach"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      # README chores are handled by the existing readme.yml. A release tag doesn't push to main, so
      # if a release should also refresh README, dispatch it: `gh workflow run readme.yml` — kept
      # separate so release ≠ README churn.

  # Best-effort iOS artifact, gated on the Android release job succeeding (so it uploads to a release
  # that's guaranteed to exist) and on this repo actually having an iOS app under ios/iosApp
  # (repo-generic: a repo with no ios/iosApp/*.xcodeproj just no-ops this job green).
  #
  # IMPORTANT — signing: CI has no Apple distribution certificate or provisioning profile, so this can
  # only produce an UNSIGNED archive. We zip the unsigned .app into a Payload/ dir as an ".ipa"-shaped
  # artifact for inspection/manual re-signing — it will NOT install via TestFlight/App Store/ad-hoc as-is.
  # A real signed, installable IPA needs the repo owner to add signing secrets (base64 .p12 cert +
  # mobileprovision, or fastlane match credentials) and a codesign/export step wired to them.
  ios-ipa:
    name: iOS IPA (unsigned)
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Detect iOS app
        id: detect
        run: |
          set -uo pipefail
          proj="$(ls -d ios/iosApp/*.xcodeproj 2>/dev/null | head -1)"
          if [ -n "$proj" ]; then
            echo "project=$proj" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ios/iosApp/*.xcodeproj in this repo — skipping the iOS artifact (no-op)."
          fi
      - name: Set up JDK 25
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - name: Setup Gradle
        if: steps.detect.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Compute version stamp
        if: steps.detect.outputs.found == 'true'
        id: version
        run: |
          set -uo pipefail
          eval "$(./scripts/version.sh)"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "buildcode=$BUILDCODE" >> "$GITHUB_OUTPUT"
      - name: Pick scheme
        if: steps.detect.outputs.found == 'true'
        id: scheme
        run: |
          set -uo pipefail
          # Override with the IOS_SCHEME repo variable if a repo has multiple app schemes and needs a
          # specific one. Default: first scheme that isn't a *Tests scheme (PaymentsLab-KMP: "iosApp").
          scheme="${IOS_SCHEME:-}"
          if [ -z "$scheme" ]; then
            scheme="$(xcodebuild -list -project "${{ steps.detect.outputs.project }}" 2>/dev/null \
              | awk '/Schemes:/{f=1;next} f && NF && $0 !~ /Tests$/{print; exit}' | xargs)"
          fi
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
        env:
          IOS_SCHEME: ${{ vars.IOS_SCHEME }}
      - name: Archive (unsigned)
        # The shared KMP framework link is wired into this Xcode project as a Run Script build phase
        # (see ios/iosApp/iosApp.xcodeproj), so this one xcodebuild invocation builds :shared for iOS
        # too — no separate Gradle step needed. CODE_SIGNING_ALLOWED=NO keeps this runnable with no
        # secrets. MARKETING_VERSION/CURRENT_PROJECT_VERSION overrides stamp Info.plist's
        # CFBundleShortVersionString/CFBundleVersion ($(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION)
        # tokens in ios/iosApp/iosApp/Info.plist) with the same MARKETING/BUILDCODE Gradle uses.
        if: steps.detect.outputs.found == 'true' && steps.scheme.outputs.scheme != ''
        id: archive
        run: |
          set -uo pipefail
          chmod +x ./gradlew
          mkdir -p build dist
          if xcodebuild -project "${{ steps.detect.outputs.project }}" -scheme "${{ steps.scheme.outputs.scheme }}" \
              -configuration Release -sdk iphoneos -archivePath build/PaymentsLab.xcarchive archive \
              MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
              CURRENT_PROJECT_VERSION="${{ steps.version.outputs.buildcode }}" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              2>&1 | tee build/xcodebuild-archive.log; then
            echo "archived=true" >> "$GITHUB_OUTPUT"
          else
            echo "archived=false" >> "$GITHUB_OUTPUT"
            echo "::warning::xcodebuild archive failed (unsigned) — see the 'Archive (unsigned)' step log. No iOS artifact will be attached this release."
          fi
      - name: Package unsigned .ipa-shaped artifact
        if: steps.detect.outputs.found == 'true' && steps.archive.outputs.archived == 'true'
        run: |
          set -uo pipefail
          app="$(find build/PaymentsLab.xcarchive/Products/Applications -maxdepth 1 -name '*.app' 2>/dev/null | head -1)"
          if [ -z "$app" ]; then
            echo "::warning::Archive succeeded but produced no .app bundle under Products/Applications; nothing to package."
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/
          ( cd dist && zip -qr "PaymentsLab-KMP-${tag}-ios-unsigned.ipa" Payload )
          rm -rf dist/Payload
          ls -la "dist/PaymentsLab-KMP-${tag}-ios-unsigned.ipa"
      - name: Upload iOS artifact to release
        if: steps.detect.outputs.found == 'true' && steps.archive.outputs.archived == 'true'
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(dist/*.ipa)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            echo "no iOS artifact to attach"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
