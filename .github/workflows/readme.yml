name: README auto-refresh

# Verifies the <!-- AUTOGEN:x --> fact spans (module badge + stats) in README.md are current —
# regenerated from settings.gradle.kts (local includes + the includeBuild(external/kmp-toolkit)
# substitution list), gradle/libs.versions.toml (the Kotlin/Compose/Ktor version badges) and
# docs/screenshots by scripts/gen-readme.sh.
#
# Why verify instead of auto-commit: main is meant to advance through PRs, and a bot's GITHUB_TOKEN
# can't push to a protected branch. This runs on the PR that changes a source file and fails if the
# spans drifted, so the author regenerates in the same PR (where they can push):
#     ./scripts/gen-readme.sh && git add README.md && git commit
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'docs/screenshots/**'
      - 'scripts/gen-readme.sh'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: README fact spans current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify README fact spans are current
        run: |
          chmod +x ./scripts/gen-readme.sh
          ./scripts/gen-readme.sh
          if ! git diff --exit-code -- README.md; then
            echo "::error::README fact spans are stale. Run ./scripts/gen-readme.sh and commit README.md in this PR."
            exit 1
          fi
          echo "README fact spans are current."
