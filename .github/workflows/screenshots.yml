name: Screenshots

# Records the Roborazzi baselines on Linux and uploads them as an artifact for review. Kept separate
# from the blocking CI gate on purpose: Robolectric's native text rendering differs subtly across
# OSes, so a strict cross-platform `verify` would be flaky. The committed baselines (recorded locally)
# are the visual reference; this job shows the current Linux render on demand.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'core/designsystem/**'
      - 'app/src/test/kotlin/com/paymentslab/app/screenshot/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  screenshots:
    name: Record screenshots
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI JDK 21 (strip machine-specific java.home)
        run: sed -i '/^org\.gradle\.java\.home/d; /^org\.gradle\.java\.installations\.paths/d' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - run: chmod +x ./gradlew

      - name: Record Roborazzi screenshots
        run: ./gradlew :app:recordRoborazziDebug
      # Baselines are only honest when recorded on this renderer (macOS fonts differ). A manual
      # dispatch on a branch commits what the CI renderer produced back to that branch, the same
      # loop Doori's and Candidai's "Record & commit baselines" jobs close. Pushes made with the
      # workflow token never trigger checks, so re-run them with an empty commit afterwards.
      - name: Commit re-recorded baselines (manual dispatch on a branch only)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/screenshots; then echo "baselines unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "test(screenshot): re-record baselines on the CI renderer"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        # An artifact is a convenience; the account's 500 MB artifact quota must not fail the gate.
        continue-on-error: true
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: warn
          retention-days: 2
