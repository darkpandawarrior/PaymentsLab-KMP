name: Deploy to Huawei AppGallery

# Uploads the release APK via AppGallery Connect's Publish API (community action). Gated on
# HUAWEI_CLIENT_ID: no Connect API key exists yet, so this job no-ops until one is created in
# AppGallery Connect (Users and permissions → API Key → Connect API).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # A skipped run still exits zero and shows green, so it must announce the skip itself
      # in the step summary — otherwise a green check silently means "never uploaded".
      HAS_SECRET: ${{ secrets.HUAWEI_CLIENT_ID != '' }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Report deploy status
        run: |
          if [ "${{ env.HAS_SECRET }}" = "true" ]; then
            echo "Deploying to Huawei AppGallery." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Not deployed to Huawei AppGallery" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No store credentials are configured, so every build and upload step was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "This run is green because nothing failed, NOT because the app was published." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the required secrets to enable it: HUAWEI_CLIENT_ID, HUAWEI_CLIENT_KEY, HUAWEI_APP_ID." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive
        if: env.HAS_SECRET == 'true'

      - name: Set up JDK 21
        if: env.HAS_SECRET == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI JDK 21 (strip machine-specific java.home)
        if: env.HAS_SECRET == 'true'
        run: sed -i '/^org\.gradle\.java\.home/d; /^org\.gradle\.java\.installations\.paths/d' gradle.properties

      - name: Setup Gradle
        if: env.HAS_SECRET == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        if: env.HAS_SECRET == 'true'
        uses: android-actions/setup-android@v3

      - run: chmod +x ./gradlew
        if: env.HAS_SECRET == 'true'

      - name: Materialize signing secrets
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          mkdir -p secrets
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > secrets/release.keystore
            {
              echo "RELEASE_STORE_FILE=$PWD/secrets/release.keystore"
              echo "RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD:-}"
              echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS:-paymentslab}"
              echo "RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-}"
            } >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        if: env.HAS_SECRET == 'true'
        run: ./gradlew :app:assembleRelease

      - name: Upload to Huawei AppGallery
        if: env.HAS_SECRET == 'true'
        uses: muhamedzeema/appgallery-deply-action@main
        with:
          client-id: ${{ secrets.HUAWEI_CLIENT_ID }}
          client-key: ${{ secrets.HUAWEI_CLIENT_KEY }}
          app-id: ${{ secrets.HUAWEI_APP_ID }}
          file-extension: apk
          file-path: app/build/outputs/apk/release/app-release.apk
          submit: true
