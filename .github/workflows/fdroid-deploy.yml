name: Publish F-Droid APK

# Builds the reproducible release APK (-Pfdroid disables R8/resource shrinking), signs it
# out-of-band with a pinned apksigner, and publishes the APK + .sha256 to a GitHub Release (the
# binary host a fdroiddata metadata yml would reference). All secrets are env-activated
# placeholders; the job is a no-op until they are configured.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0-fdroid)"
        required: true

permissions:
  contents: write

jobs:
  publish-fdroid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
          submodules: recursive
          # Without full history `git rev-list --count HEAD` returns 1, so versionCode
          # becomes 2. Every APK published to F-Droid so far carried versionCode 2, which
          # means no client could ever offer an upgrade.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI JDK 21 (strip machine-specific java.home)
        run: sed -i '/^org\.gradle\.java\.home/d; /^org\.gradle\.java\.installations\.paths/d' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - run: chmod +x ./gradlew

      - name: Build reproducible release APK (no minify)
        run: ./gradlew :app:assembleRelease -Pfdroid --no-build-cache

      - name: Decode the upload keystore
        run: echo "${ANDROID_KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Sign the APK with a pinned apksigner
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          OUT="PaymentsLab-KMP-${{ github.event.inputs.tag }}.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "${RUNNER_TEMP}/release.keystore" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --out "$OUT" "$UNSIGNED"
          sha256sum "$OUT" > "$OUT.sha256"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Publish to GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" \
            "PaymentsLab-KMP-$TAG.apk" \
            "PaymentsLab-KMP-$TAG.apk.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
