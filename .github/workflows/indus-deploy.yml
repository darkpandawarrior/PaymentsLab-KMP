name: Deploy to Indus Appstore

# Publishes the release AAB to Indus Appstore via PhonePe's Indus-Flows action, mirroring the
# ported-from-reference workflow at github.com/SnakeEye-sudo/indus-appstore-android. Gated on
# INDUS_API_KEY: a public sandbox repo ships no keystore or store credentials (see fastlane/Fastfile
# and release.yml), so this job no-ops until the secret is configured.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy AAB
    runs-on: ubuntu-latest
    env:
      # A skipped run still exits zero and shows green, so it must announce the skip itself
      # in the step summary — otherwise a green check silently means "never uploaded".
      HAS_SECRET: ${{ secrets.INDUS_API_KEY != '' }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Report deploy status
        run: |
          if [ "${{ env.HAS_SECRET }}" = "true" ]; then
            echo "Deploying to Indus Appstore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Not deployed to Indus Appstore" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No store credentials are configured, so every build and upload step was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "This run is green because nothing failed, NOT because the app was published." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the required secrets to enable it: INDUS_API_KEY, INDUS_APP_ID." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive
        if: env.HAS_SECRET == 'true'

      - name: Set up JDK 21
        if: env.HAS_SECRET == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI JDK 21 (strip machine-specific java.home)
        if: env.HAS_SECRET == 'true'
        run: sed -i '/^org\.gradle\.java\.home/d; /^org\.gradle\.java\.installations\.paths/d' gradle.properties

      - name: Setup Gradle
        if: env.HAS_SECRET == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        if: env.HAS_SECRET == 'true'
        uses: android-actions/setup-android@v3

      - run: chmod +x ./gradlew
        if: env.HAS_SECRET == 'true'

      - name: Materialize signing secrets
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          mkdir -p secrets
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > secrets/release.keystore
            {
              echo "RELEASE_STORE_FILE=$PWD/secrets/release.keystore"
              echo "RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD:-}"
              echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS:-paymentslab}"
              echo "RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-}"
            } >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Requires a signingConfig on :app (see fastlane/Fastfile's deploy_internal comments) —
      # otherwise Indus Appstore will reject the unsigned bundle.
      - name: Build release AAB
        if: env.HAS_SECRET == 'true'
        run: ./gradlew :app:bundleRelease

      # Do not trust hasReleaseSigning in app/build.gradle.kts — it silently falls back to the
      # DEBUG signingConfig when no release signing is configured, so a build can "succeed" while
      # actually being debug-signed. Check the artifact itself before it ever reaches a real store.
      - name: Verify release signer is not the debug cert
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          workdir="$(mktemp -d)"
          unzip -q "$aab" -d "$workdir"
          cert_file="$(find "$workdir/META-INF" -maxdepth 1 \( -name '*.RSA' -o -name '*.DSA' -o -name '*.EC' \) | head -1)"
          if [ -z "$cert_file" ]; then
            echo "::error::No signer certificate found in $aab — refusing to submit an unsigned bundle."
            exit 1
          fi
          subject="$(keytool -printcert -file "$cert_file" | sed -n 's/^Owner: //p')"
          echo "Signer: $subject"
          if echo "$subject" | grep -qi 'CN=Android Debug'; then
            echo "::error::$aab is signed with the well-known Android debug certificate (CN=Android Debug). Refusing to submit a debug-signed build to Indus Appstore. Check that ANDROID_KEYSTORE_B64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD are set correctly."
            exit 1
          fi

      - name: Deploy to Indus Appstore
        if: env.HAS_SECRET == 'true'
        uses: PhonePe/Indus-Flows@v1
        with:
          app_bundle_path: 'app/build/outputs/bundle/release/app-release.aab'
          api_key: ${{ secrets.INDUS_API_KEY }}
          app_id: ${{ secrets.INDUS_APP_ID }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
