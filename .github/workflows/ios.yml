name: iOS

# The Ubuntu `ci.yml` gate cannot build a single line of iosMain — Kotlin/Native's Apple targets
# need a macOS host. Without this workflow an iosMain regression only ever surfaced on a developer's
# laptop, or in the best-effort unsigned archive inside github-release.yml, which runs on tag only.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    name: Compile & link PaymentsLabShared.framework
    # Pinned, not macos-latest: the Xcode/Kotlin-Native pairing is the thing under test here, so it
    # must not move under us the day GitHub reassigns the `latest` alias.
    runs-on: macos-15

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # :app's versionCode derives from `git rev-list --count HEAD`; scripts/version.sh runs
          # during configuration of every project, this one included.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ~1 GB of Kotlin/Native toolchain lives outside ~/.gradle. Keyed on the catalog so it
      # invalidates exactly when the Kotlin version moves.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v1-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Linking, not just compiling: a Kotlin/Native framework link is where an unresolved symbol
      # from a cinterop or an Objective-C export clash actually fails. Both slices are built because
      # device (arm64) and simulator differ in their export surface.
      - name: Link framework (simulator + device)
        run: |
          ./gradlew \
            :ios:shared:linkDebugFrameworkIosSimulatorArm64 \
            :ios:shared:linkDebugFrameworkIosArm64

      - name: Show framework output
        run: find ios/shared/build/bin -name "*.framework" -maxdepth 4 -print

      # Kotlin/Native compilation of the shared iOS surface is the gate above; this is the
      # commonTest suite that :ios:shared and its dependencies carry, run on the iOS simulator
      # target so platform actuals are exercised rather than their JVM twins.
      - name: iOS simulator unit tests
        run: ./gradlew iosSimulatorArm64Test
