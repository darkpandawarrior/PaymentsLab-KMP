name: Deploy to Samsung Galaxy Store

# Uploads the release APK via Samsung's Content Publish API (no maintained community action exists,
# so this is hand-rolled curl). Gated on SAMSUNG_ACCESS_TOKEN: no Seller Portal API credentials
# exist yet, so this job no-ops until configured.
#
# NOTE: the access-token endpoint/grant isn't in the public docs excerpt this was written against —
# see "Create an Access Token" at developer.samsung.com/galaxy-store/galaxy-store-developer-api
# before wiring SAMSUNG_ACCESS_TOKEN generation into this workflow (today it expects the token as a
# pre-generated secret, refreshed manually/out-of-band).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # A skipped run still exits zero and shows green, so it must announce the skip itself
      # in the step summary — otherwise a green check silently means "never uploaded".
      HAS_SECRET: ${{ secrets.SAMSUNG_ACCESS_TOKEN != '' }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Report deploy status
        run: |
          if [ "${{ env.HAS_SECRET }}" = "true" ]; then
            echo "Deploying to Samsung Galaxy Store." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Not deployed to Samsung Galaxy Store" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No store credentials are configured, so every build and upload step was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "This run is green because nothing failed, NOT because the app was published." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the required secrets to enable it: SAMSUNG_ACCESS_TOKEN, SAMSUNG_SERVICE_ACCOUNT_ID, SAMSUNG_CONTENT_ID." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive
        if: env.HAS_SECRET == 'true'

      - name: Set up JDK 21
        if: env.HAS_SECRET == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI JDK 21 (strip machine-specific java.home)
        if: env.HAS_SECRET == 'true'
        run: sed -i '/^org\.gradle\.java\.home/d; /^org\.gradle\.java\.installations\.paths/d' gradle.properties

      - name: Setup Gradle
        if: env.HAS_SECRET == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        if: env.HAS_SECRET == 'true'
        uses: android-actions/setup-android@v3

      - run: chmod +x ./gradlew
        if: env.HAS_SECRET == 'true'

      - name: Materialize signing secrets
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          mkdir -p secrets
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > secrets/release.keystore
            {
              echo "RELEASE_STORE_FILE=$PWD/secrets/release.keystore"
              echo "RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD:-}"
              echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS:-paymentslab}"
              echo "RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-}"
            } >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        if: env.HAS_SECRET == 'true'
        run: ./gradlew :app:assembleRelease

      - name: Create upload session
        if: env.HAS_SECRET == 'true'
        id: session
        run: |
          set -euo pipefail
          SESSION_ID=$(curl -sf -X POST "https://devapi.samsungapps.com/seller/createUploadSessionId" \
            -H "Authorization: Bearer ${SAMSUNG_ACCESS_TOKEN}" \
            -H "service-account-id: ${SAMSUNG_SERVICE_ACCOUNT_ID}" \
            -H "Content-Type: application/json" | jq -r '.sessionId')
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
        env:
          SAMSUNG_ACCESS_TOKEN: ${{ secrets.SAMSUNG_ACCESS_TOKEN }}
          SAMSUNG_SERVICE_ACCOUNT_ID: ${{ secrets.SAMSUNG_SERVICE_ACCOUNT_ID }}

      - name: Upload binary
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          curl -sf -X POST "https://devapi.samsungapps.com/galaxyapi/fileUpload" \
            -H "Authorization: Bearer ${SAMSUNG_ACCESS_TOKEN}" \
            -H "service-account-id: ${SAMSUNG_SERVICE_ACCOUNT_ID}" \
            -F "file=@app/build/outputs/apk/release/app-release.apk" \
            -F "sessionId=${{ steps.session.outputs.session_id }}"
        env:
          SAMSUNG_ACCESS_TOKEN: ${{ secrets.SAMSUNG_ACCESS_TOKEN }}
          SAMSUNG_SERVICE_ACCOUNT_ID: ${{ secrets.SAMSUNG_SERVICE_ACCOUNT_ID }}

      - name: Submit for review
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          curl -sf -X POST "https://devapi.samsungapps.com/seller/contentSubmit" \
            -H "Authorization: Bearer ${SAMSUNG_ACCESS_TOKEN}" \
            -H "service-account-id: ${SAMSUNG_SERVICE_ACCOUNT_ID}" \
            -H "Content-Type: application/json" \
            -d "{\"contentId\": \"${SAMSUNG_CONTENT_ID}\"}"
        env:
          SAMSUNG_ACCESS_TOKEN: ${{ secrets.SAMSUNG_ACCESS_TOKEN }}
          SAMSUNG_SERVICE_ACCOUNT_ID: ${{ secrets.SAMSUNG_SERVICE_ACCOUNT_ID }}
          SAMSUNG_CONTENT_ID: ${{ secrets.SAMSUNG_CONTENT_ID }}
