name: Release verification build

# Manual pre-release check: runs the full gate + builds the release APK + archives the R8 mapping,
# without publishing anything. Previously this ALSO auto-published a GitHub Release on every `v*`
# tag push (softprops/action-gh-release) — that raced with github-release.yml's `gh release
# create/edit` on the exact same tag trigger (duplicate/overwritten release notes & assets,
# nondeterministic which one won). github-release.yml is now the single tag-triggered publisher
# (three-tier-versioning-aware, --continue build, iOS IPA); this workflow stays a manual,
# publish-nothing sanity check you can run before cutting a tag. The APK is UNSIGNED unless a
# keystore secret is configured (see docs/RELEASE.md, fastlane/Fastfile).

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Build & verify release APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI JDK 21 (strip machine-specific java.home)
        run: sed -i '/^org\.gradle\.java\.home/d; /^org\.gradle\.java\.installations\.paths/d' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - run: chmod +x ./gradlew

      - name: Verification gate
        run: ./gradlew fastGate

      - name: Build release APK (unsigned unless a keystore secret is configured, R8-minified)
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        # An artifact is a convenience; the account's 500 MB artifact quota must not fail the gate.
        continue-on-error: true
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 2

      # The R8 mapping deobfuscates release crash stack traces — archive it per release (a real
      # deployment uploads this to Crashlytics/Sentry).
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        # An artifact is a convenience; the account's 500 MB artifact quota must not fail the gate.
        continue-on-error: true
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 2
